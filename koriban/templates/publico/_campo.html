{% if campo.widget_type == "checkbox" %}
<div class="campo campo-check{% if campo.errors %} con-error{% endif %}">
  {{ campo }}
  <label for="{{ campo.id_for_label }}">{{ campo.label }}</label>
</div>
{% if campo.errors %}<p class="error">{{ campo.errors.0 }}</p>{% endif %}
{% else %}
<div class="campo{% if campo.errors %} con-error{% endif %}">
  <label for="{{ campo.id_for_label }}">{{ campo.label|capfirst }}{% if not campo.field.required %} <span class="muted small">(opcional)</span>{% endif %}</label>
  {{ campo }}
  {% if campo.help_text %}<div class="ayuda">{{ campo.help_text }}</div>{% endif %}
  {% if campo.errors %}<p class="error">{{ campo.errors.0 }}</p>{% endif %}
</div>
{% endif %}
