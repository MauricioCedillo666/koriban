{% load static %}<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Koriban · Sitios web + CRM para PYMES{% endblock %}</title>
  <meta name="description" content="Koriban: diseño, implementación e integración de páginas web con CRM para PYMES de la CDMX y área metropolitana.">
  <link rel="icon" href="{% static 'img/logo.svg' %}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/koriban.css' %}">
</head>
<body class="{% block clase_body %}{% endblock %}">
  {% if messages %}
    <div class="mensajes">
      {% for m in messages %}<div class="mensaje {{ m.tags }}">{{ m }}</div>{% endfor %}
    </div>
  {% endif %}
  {% block cuerpo %}{% endblock %}
  <script src="{% static 'js/koriban.js' %}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
